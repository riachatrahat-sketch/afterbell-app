name: Build Android APK

# Run it by hand: GitHub > Actions > "Afterbell app" > Run workflow.
on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "Backend address from Vercel, without /api"
        required: true
        type: string
        default: "https://afterbell-backend.vercel.app"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: afterbell_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Check the backend address
        env:
          API_BASE: ${{ inputs.api_base }}
        run: |
          case "$API_BASE" in
            https://*) ;;
            *) echo "::error::The backend address must start with https://"; exit 1 ;;
          esac
          case "$API_BASE" in
            */api|*/api/|*/) echo "::error::Write the address without /api and without a slash at the end"; exit 1 ;;
          esac
          curl -fsS --max-time 30 "$API_BASE/api/health" || { echo "::error::$API_BASE/api/health did not answer. Deploy the backend on Vercel first."; exit 1; }

      - name: Create the Android project files
        run: |
          mkdir -p /tmp/keep && cp -r lib test pubspec.yaml analysis_options.yaml /tmp/keep/
          flutter create --platforms=android --org com.afterbellacademy --project-name afterbell_app .
          cp -r /tmp/keep/lib /tmp/keep/test /tmp/keep/pubspec.yaml /tmp/keep/analysis_options.yaml .

      - name: Add internet permission and app name
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          intents = '''
                  <intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>
                  <intent><action android:name="android.intent.action.SENDTO"/><data android:scheme="mailto"/></intent>'''
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          if 'android.intent.action.SENDTO' not in s:
              if '<queries>' in s:
                  s = s.replace('<queries>', '<queries>' + intents, 1)
              else:
                  s = s.replace('</manifest>', '    <queries>' + intents + '\n    </queries>\n</manifest>', 1)
          s = re.sub(r'android:label="[^"]*"', 'android:label="Afterbell Academy"', s, count=1)
          open(p, 'w', encoding='utf-8').write(s)
          print(s)
          PY

      - run: flutter pub get

      - name: Check the code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build the APK
        env:
          API_BASE: ${{ inputs.api_base }}
        run: flutter build apk --release --dart-define=API_BASE="$API_BASE"

      - name: Name the file
        run: cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/afterbell-academy.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: afterbell-academy-apk
          path: afterbell-academy.apk

      - name: Publish as a release (download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Afterbell Academy app, build ${{ github.run_number }}
          body: "Test build. Backend: ${{ inputs.api_base }}"
          files: afterbell-academy.apk
